<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Login Page</title>

    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, minimum-scale=1" name="viewport">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./assets/favicon.ico">
  </head>
  <body>
    <main>
      <section class="hero-container">
        <div class="hero-content">
          <h3 class="motto">Social media shared today, tomorrow or by location</h3>
          <div class="login-pics">
            <img class="ellipse" src="./assets/svg/login-ellipse.svg">
            <div class="phone-pics">
              <img class="phone-pic phone-pic-left" src="./assets/png/phone-pic.png" alt="Smartphone">
              <img class="phone-pic phone-pic-right" src="./assets/png/phone-pic.png" alt="Smartphone">
              <img class="phone-pic phone-pic-front" src="./assets/png/phone-pic.png" alt="Smartphone">
            </div>
          </div>
        </div>
      </section>
      <section class="login-container">
        <div class="login-content">
          <div class="logo-container">
            <img src="./assets/png/logo.png" class="logo-img" alt="Logo">
            <h2 class="logo-text">Logo</h2>
          </div>

          <div class="text-container">
            <h1 class="heading-1">Create account</h1>
            <p class="paragraph">For business, band or celebrity.</p>
          </div>

          <div class="form-container">
            <form class="login-form">
              <label class="label">
                First name
                <input type="text" class="input-field">
              </label>
              <label class="label">
                Last name
                <input type="text" class="input-field">
              </label>
              <label class="label">
                Email or phone number
                <input type="text" class="input-field">
              </label>
              <label class="label">
                <span>Date of birth <span class="date-format">(MM/DD/YY)</span></span>
                <input type="date" class="input-field input-date">
              </label>
              <label class="label">
                Password
                <input type="password" class="input-field">
              </label>
              <label class="label">
                Confirm password
                <input type="password" class="input-field">
              </label>
              <div class="checkboxes-container">
                <label class="label label-checkbox">
                  <input type="checkbox" class="checkbox">
                  Remember me
                </label>
                <label class="label label-checkbox">
                  <input type="checkbox" class="checkbox">
                  I agree to all the <a class="link" href="#!">Terms</a> and <a class="link" href="#!">Privacy policy</a> 
                </label>
              </div>
              <div class="forgot-password-container">
                <a class="paragraph link" href="#!">Forgot password?</a>
              </div>
              <input type="submit" class="button create-account" value="Create account">
              <button class="button signin-google">
                <img class="icon-google" src="./assets/png/icon-google.png" alt="G">
                Sign-in with google
              </button>
            </form>

            <div class="prompt-container">
              <p class="paragraph">Don't have an account? <a class="link" href="#!">Log In</a></p>
            </div>
          </div>

          <div  class="store-badges-container">
            <a class="store-badge" href="#!"><img src="./assets/svg/googleplay-badge.svg" alt="Google Play"></a>
            <a class="store-badge" href="#!"><img src="./assets/svg/appstore-badge.svg" alt="App Store"></a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
