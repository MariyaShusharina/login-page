<DOCTYPE! html>
<html lang="en">
  <head>
    <title>Login Page</title>

    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, minimum-scale=1" name="viewport">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./assets/favicon.ico">
  </head>
  <body>
    <main>
      <section class="hero-container">
        <div class="hero-content">
          <h3 class="motto">Social media shared today, tomorrow or by location</h3>
          <div class="login-pics">
            <img class="ellipse" src="./assets/svg/login-ellipse.svg">
            <div class="phone-pics">
              <img class="phone-pic phone-pic-left" src="./assets/png/phone-pic.png" alt="Smartphone">
              <img class="phone-pic phone-pic-right" src="./assets/png/phone-pic.png" alt="Smartphone">
              <img class="phone-pic phone-pic-front" src="./assets/png/phone-pic.png" alt="Smartphone">
            </div>
          </div>
        </div>
      </section>
      <section class="login-container"></section>
    </main>
  </body>
</html>
